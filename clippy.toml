# Entry names built from a `Path` get `\` separators on Windows, which other tools cannot read.
disallowed-methods = [
    { path = "zip::write::ZipWriter::start_file", reason = "use ArchiveBuilder, or tmc_langs_framework::entry_name for the name" },
    { path = "zip::write::ZipWriter::add_directory", reason = "use ArchiveBuilder, or tmc_langs_framework::entry_name for the name" },
    { path = "tar::builder::Builder::append_dir", reason = "use ArchiveBuilder" },
    { path = "tar::builder::Builder::append_path_with_name", reason = "use ArchiveBuilder" },
]
