[package]
name = "tmc-langs-util"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ts-rs = { workspace = true, features = ["serde-compat"], optional = true }

dunce = "1.0.3"
log = "0.4.14"
nom = "8.0.0"
nom-language = "0.1.0"
once_cell = "1.9.0"
schemars = "1.0.4"
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.79"
serde_path_to_error = "0.1.7"
serde_yaml = "0.9.10"
tempfile = "3.3.0"
thiserror = "2.0.3"
toml = "1.1.2"
type-map = "0.5.0"
walkdir = "2.3.2"

[target.'cfg(windows)'.dependencies]
fd-lock = "4.0.0"
# `winapi`'s modules are feature-gated; declare the ones `file_util::lock_windows`
# imports rather than relying on some other crate in the dependency graph enabling
# them, which only happens to work because Cargo unifies features workspace-wide
# and breaks the moment this crate is checked on its own.
winapi = { version = "0.3.9", features = ["winbase", "winnt"] }

[target.'cfg(unix)'.dependencies]
file-lock = "2.1.11"

[dev-dependencies]
simple_logger = "5.0.0"
