name: Run tests

on:
  push:
    branches: [main, "[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main, "[0-9]+.[0-9]+.[0-9]+"]

env:
  RUST_LOG: debug,j4rs=warn
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            java-arch: x64
          - os: macos-latest
            rust-target: aarch64-apple-darwin
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix environment
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-nix-env
      - name: Check the flake's Rust matches rust-version
        if: runner.os != 'Windows'
        run: |
          expected=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          actual=$(rustc --version | cut -d' ' -f2)
          if [ "$expected" != "$actual" ]; then
            echo "::error::Cargo.toml declares rust-version $expected but flake.nix provides $actual"
            exit 1
          fi

      - name: Install Rust
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.rust-target }}
          components: clippy, rustfmt
      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Diagnostics on Windows
        if: runner.os == 'Windows'
        run: "gci env:"

      - name: Enable long paths for git
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true # allow long paths from git deps

      - name: Rustfmt
        run: cargo fmt -- --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-features --target ${{ matrix.rust-target }} -- -D clippy::disallowed_methods

      - name: Build test binary
        run: cargo test --no-run --target ${{ matrix.rust-target }}

      - name: Install Java
        if: runner.os == 'Windows'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "11"
          architecture: ${{ matrix.java-arch }}

      # the windows image doesn't ship ant, which the ant plugin shells out to
      - name: Install Ant
        if: runner.os == 'Windows'
        run: choco install ant --version 1.10.18 --no-progress -y

      - name: Install R
        if: runner.os == 'Windows'
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: "4.4"
      - name: Install the R test runner
        if: runner.os == 'Windows'
        run: |
          Rscript -e "install.packages(c('testthat', 'jsonlite', 'R.utils'), repos = 'https://cloud.r-project.org')"
          R CMD INSTALL crates/plugins/r/tests/tmcRtestrunner

      # The make plugin's tests need the `check` C library and valgrind, which have no Windows
      # builds the plugin supports, so they run on Linux only.

      - name: Install C#
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        env:
          # The image's own install carries newer SDKs, which the C# runner would pick over 8.0.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "8.0.x"

      # On macOS the image's .NET in ~/.dotnet reaches the C# runner despite the flake's PATH and
      # DOTNET_ROOT, and its newer SDKs break the runner, so only the flake's .NET may remain.
      - name: Remove the image's .NET
        if: runner.os == 'macOS'
        run: |
          rm -rf ~/.dotnet
          sudo rm -f /usr/local/bin/dotnet
          if type -ap dotnet | grep -v '^/nix/store/'; then
            echo "::error::a .NET outside the flake is still on PATH"
            exit 1
          fi
          dotnet --list-sdks

      - name: Run tests
        run: cargo test --no-fail-fast --target ${{ matrix.rust-target }}

      # Drift gate for bindings.schema.json / bindings.d.ts; regenerate with the
      # #[ignore]d generate_cli_bindings{,_schema} tests. The schema half also
      # runs in "Run tests" above; this adds the ts-rs (bindings.d.ts) half.
      - name: Check langs contract bindings are up to date
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p tmc-langs-cli --features ts-rs --target ${{ matrix.rust-target }} -- bindings_

      - name: Check number of dynamic libraries hasn't changed
        if: matrix.os == 'ubuntu-latest'
        run: |
          DYLIBS=$(ldd ./target/x86_64-unknown-linux-gnu/debug/tmc-langs-cli)
          EXPECTED=6
          ACTUAL=$(echo "$DYLIBS" | wc -l)
          if [ $ACTUAL -ne $EXPECTED ]; then
            echo "::error title=unexpected-dynamic-libraries::Expected $EXPECTED dynamic libraries, found $ACTUAL ($DYLIBS)"
            exit 1
          fi

      - name: Check number of dynamic libraries hasn't changed
        if: matrix.os == 'macos-latest'
        run: |
          DYLIBS=$(otool -L ./target/aarch64-apple-darwin/debug/tmc-langs-cli)
          EXPECTED=6
          ACTUAL=$(echo "$DYLIBS" | wc -l)
          if [ $ACTUAL -ne $EXPECTED ]; then
            echo "::error title=unexpected-dynamic-libraries::Expected $EXPECTED dynamic libraries, found $ACTUAL ($DYLIBS)"
            exit 1
          fi
