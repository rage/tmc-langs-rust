name: Setup Nix environment
description: Install Nix and export this repo's flake devShell (Rust, .NET, JDK, Maven, Ant, Python, R, check, valgrind, the native build tooling) to subsequent steps
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
    - name: Export flake devShell environment
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"

        # Each `run:` step is a fresh shell, so the devShell env only reaches later steps
        # through $GITHUB_ENV. Writing to a file first (rather than `source <(nix print-dev-env)`)
        # lets `set -e` catch a `nix` failure. The script ends with `eval "$shellHook"`.
        nix print-dev-env > "$RUNNER_TEMP/nix-dev-env.sh"

        declare -A before
        while IFS= read -r -d '' entry; do
          before[${entry%%=*}]=${entry#*=}
        done < <(env -0)

        source "$RUNNER_TEMP/nix-dev-env.sh"

        # Exports everything the devShell changed, not a fixed list: stdenv's setup hooks set
        # dozens of per-platform variables (NIX_CFLAGS_COMPILE, NIX_CC_WRAPPER_TARGET_HOST_<triple>,
        # the Darwin SDK) that the cc wrapper needs. Lowercase-initial names are derivation attributes;
        # the skipped ones point at the throwaway build directory or belong to this shell.
        skipped=" HOME PWD OLDPWD SHLVL SHELL _ NIX_BUILD_TOP NIX_BUILD_CORES TMP TMPDIR TEMP TEMPDIR "
        delimiter="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
        for name in $(compgen -e); do
          [[ $name =~ ^_?[A-Z] ]] || continue
          [[ $skipped == *" $name "* ]] && continue
          [[ ${before[$name]+set} && ${before[$name]} == "${!name}" ]] && continue
          printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "${!name}" "$delimiter"
        done >> "$GITHUB_ENV"
